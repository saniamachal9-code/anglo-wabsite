kind = "web"
previewPath = "/"
title = "Anglo Sanskrit Senior Secondary School, Pundri"
version = "1.0.0"
id = "artifacts/arya-school"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20427

[services.development]
run = "pnpm --filter @workspace/arya-school run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/arya-school", "run", "build" ]
serve = "static"
publicDir = "artifacts/arya-school/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20427"
BASE_PATH = "/"
