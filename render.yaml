services:
  - type: web
    name: anglo-wabsite
    runtime: node
    buildCommand: pnpm install && pnpm --filter @workspace/api-server run build && pnpm --filter @workspace/arya-school run build
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: API_PORT
        value: 4000
